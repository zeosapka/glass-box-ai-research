<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="100%" height="100%" fill="white"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">N17–N47 Activation Correlation</text><text x="450" y="70" text-anchor="middle" font-family="Arial" font-size="15">Class 0 only: Pearson r = 0.7846</text><line x1="90" y1="440" x2="820" y2="440" stroke="#333"/><line x1="90" y1="90" x2="90" y2="440" stroke="#333"/><line x1="110" y1="420" x2="790" y2="120" stroke="#c0504d" stroke-width="3"/><g fill="#4f81bd" opacity="0.45"><circle cx="160" cy="380" r="5"/><circle cx="210" cy="350" r="5"/><circle cx="250" cy="330" r="5"/><circle cx="300" cy="310" r="5"/><circle cx="350" cy="280" r="5"/><circle cx="390" cy="270" r="5"/><circle cx="440" cy="235" r="5"/><circle cx="490" cy="220" r="5"/><circle cx="540" cy="195" r="5"/><circle cx="600" cy="175" r="5"/><circle cx="650" cy="150" r="5"/><circle cx="710" cy="135" r="5"/></g><text x="450" y="485" text-anchor="middle" font-family="Arial" font-size="16">N17 activation</text><text x="45" y="265" transform="rotate(-90 45 265)" font-family="Arial" font-size="16">N47 activation</text><text x="450" y="515" text-anchor="middle" font-family="Arial" font-size="12">All-test correlation = 0.4485; correlation is observational, not causal proof.</text></svg>